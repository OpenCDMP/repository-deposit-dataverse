cache:
  manager:
    fallbackToNoOpCache: true
    caffeineCaches:
      - names: [ "logoByRepository" ]
        allowNullValues: true
        initialCapacity: 100
        maximumSize: 500
        enableRecordStats: false
        expireAfterWriteMinutes: 10
        expireAfterAccessMinutes: 10
        refreshAfterWriteMinutes: 10
      - names: [ "dataverseCitationSchema" ]
        allowNullValues: true
        initialCapacity: 10
        maximumSize: 50
        enableRecordStats: false
        expireAfterWriteMinutes: 60
    mapCaches:
  logoByRepository:
    name: logoByRepository
    keyPattern: dataverseplugin_$repo$:v0
  dataverse-citation-schema:
    name: dataverseCitationSchema
    keyPattern: dataverse_citation_schema_$repositoryUrl$:v0
